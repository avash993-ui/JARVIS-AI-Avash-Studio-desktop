name: Build Jarvis Desktop

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'jarvis-desktop/**'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: jarvis-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-desktop-windows
          path: jarvis-desktop/dist/*.exe
