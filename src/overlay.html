<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif; }
  /* Minimal "Hey Siri"-style bubble: just the orb, a tiny close button, one status line. */
  .panel {
    width: 150px; margin: 10px auto 0; padding: 10px 6px 12px; position: relative;
    background: #0C1320dd; border: 1px solid #0B5C6B; border-radius: 26px;
    color: #FFE7B0; box-shadow: 0 10px 30px #000a;
  }
  .close {
    position: absolute; top: 6px; left: 6px; width: 20px; height: 20px; border-radius: 10px;
    background: #0C1320; border: none; color: #8A94A6; font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .orb {
    width: 78px; height: 78px; margin: 4px auto 8px; border-radius: 50%; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #FFD766, #7a4e00);
    box-shadow: 0 0 24px #FFB30066;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .orb.listening { animation: pulse 0.9s ease-in-out infinite; box-shadow: 0 0 32px #00E5FF88; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .status { text-align: center; font-size: 11px; line-height: 1.6; max-height: 60px; overflow: hidden; padding: 0 4px; }
</style>
</head>
<body>
  <div class="panel">
    <button class="close" id="ovClose">✕</button>
    <div class="orb" id="ovOrb"></div>
    <div class="status" id="ovStatus"></div>
  </div>
<script src="i18n.js"></script>
<script src="stt.js"></script>
<script src="wake.js"></script>
<script src="persona.js"></script>
<script src="chatcore.js"></script>
<script src="actions.js"></script>
<script src="overlay.js"></script>
</body>
</html>
